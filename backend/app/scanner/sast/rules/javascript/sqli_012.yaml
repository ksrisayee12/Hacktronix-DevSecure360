rule_id: js_sqli_012
vuln_class: SQLi
severity: Critical
issue: SQL Injection via mssql (CWE-89)
cwe: CWE-89
sources:
- req.query
- req.body
- req.params
- req.headers
- req.cookies
- request.query
- request.body
- location.search
- location.hash
- document.URL
- document.referrer
