rule_id: js_xss_011
vuln_class: XSS
severity: High
issue: DOM XSS via element.setAttribute('src' (CWE-79)
cwe: CWE-79
sources:
- req.query
- req.body
- req.params
- req.headers
- req.cookies
- request.query
- request.body
- location.search
- location.hash
- document.URL
- document.referrer
- window.location
- process.env
- process.argv
sinks:
- element.setAttribute('src'
sanitizers:
- DOMPurify.sanitize
- escapeHtml
- textContent
- innerText
remediation: Never assign user-controlled data to element.setAttribute('src'. Use
  textContent or DOMPurify.sanitize().
