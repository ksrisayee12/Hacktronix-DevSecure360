rule_id: js_sqli_001
vuln_class: SQLi
severity: Critical
issue: SQL Injection via Sequelize raw (CWE-89)
cwe: CWE-89
sources:
- req.query
- req.body
- req.params
- req.headers
- req.cookies
- request.query
- request.body
- location.search
- location.hash
- document.URL
- document.referrer
- window.location
- process.env
- process.argv
sinks:
- sequelize.query(
sanitizers:
- parameterized
- '?'
- $
remediation: Use parameterized queries with Sequelize raw. Never concatenate user
  input into SQL.
