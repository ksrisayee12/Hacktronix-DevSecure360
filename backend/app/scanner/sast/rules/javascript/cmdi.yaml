rule_id: js_cmdi_001
language: javascript
vuln_class: CMDi
severity: High
cwe: CWE-78
owasp: A03:2021
confidence: Confirmed
sources:
  - req.query
  - req.body
  - req.params
  - process.env
  - process.argv
sinks:
  - exec(
  - execSync(
  - spawn(
  - spawnSync(
  - execFile(
  - child_process.exec
  - child_process.execSync
  - child_process.spawn
sanitizers:
  - sanitize-shell
  - shell-escape
issue: "Command Injection via unsanitized user input"
message: "User-controlled input flows into a Node.js child_process function, allowing arbitrary command execution on the server."
remediation: "Use execFile with an array of arguments instead of exec with string interpolation. Validate and whitelist all user input before passing to shell commands."
