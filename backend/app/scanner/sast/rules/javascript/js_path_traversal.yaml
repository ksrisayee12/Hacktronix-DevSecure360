remediation: |-
  Validate file paths to ensure they reside within the expected directory. Use path.basename() if only a filename is expected.

  UNSAFE:
    fs.readFile('/uploads/' + req.query.file)

  SAFE:
    const filename = path.basename(req.query.file)
    fs.readFile(path.join('/uploads', filename))
