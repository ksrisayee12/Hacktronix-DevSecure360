rule_id: js_deser_005
vuln_class: Deserialization
severity: Critical
issue: Insecure Deserialization via serialize-javascript (CWE-502)
cwe: CWE-502
sources:
- req.query
- req.body
- req.params
- req.headers
- req.cookies
- request.query
- request.body
- location.search
- location.hash
- document.URL
- document.referrer
- window.location
- process.env
- process.argv
sinks:
- serialize-javascript
sanitizers:
- JSON.parse
- yaml.safeLoad
remediation: Never deserialize untrusted data with serialize-javascript.
