rule_id: js_xss_004
vuln_class: XSS
severity: High
issue: DOM XSS via document.writeln (CWE-79)
cwe: CWE-79
sources:
- req.query
- req.body
- req.params
- req.headers
- req.cookies
- request.query
- request.body
- location.search
- location.hash
- document.URL
- document.referrer
- window.location
- process.env
- process.argv
sinks:
- document.writeln
sanitizers:
- DOMPurify.sanitize
- escapeHtml
- textContent
- innerText
remediation: Never assign user-controlled data to document.writeln. Use textContent
  or DOMPurify.sanitize().
