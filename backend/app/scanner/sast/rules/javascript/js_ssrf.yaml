remediation: |-
  Validate requested URLs against a strict allowlist of allowed hostnames. Do not allow users to specify arbitrary URLs to fetch.

  UNSAFE:
    axios.get(req.query.url)

  SAFE:
    if (ALLOWED_URLS.includes(req.query.url)) { axios.get(req.query.url); }
