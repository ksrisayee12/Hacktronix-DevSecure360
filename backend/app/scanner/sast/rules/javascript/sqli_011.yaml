rule_id: js_sqli_011
vuln_class: SQLi
severity: Critical
issue: SQL Injection via oracledb (CWE-89)
cwe: CWE-89
sources:
- req.query
- req.body
- req.params
- req.headers
- req.cookies
- request.query
- request.body
- location.search
- location.hash
- document.URL
- document.referrer
- window.location
- process.env
- process.argv
sinks:
- oracledb.execute(
sanitizers:
- parameterized
- '?'
- $
remediation: Use parameterized queries with oracledb. Never concatenate user input
  into SQL.
