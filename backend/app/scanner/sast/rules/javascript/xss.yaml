rule_id: js_xss_001
language: javascript
vuln_class: XSS
severity: Medium
cwe: CWE-79
owasp: A03:2021
confidence: Confirmed
sources:
  - req.query
  - req.body
  - req.params
  - request.query
  - request.body
  - window.location
  - document.location
  - document.URL
  - location.search
  - location.hash
sinks:
  - innerHTML
  - outerHTML
  - document.write(
  - document.writeln(
  - eval(
  - setTimeout(
  - setInterval(
  - res.send(
  - res.write(
sanitizers:
  - DOMPurify.sanitize
  - he.encode
  - escapeHtml(
  - htmlspecialchars
  - encodeURIComponent(
  - textContent
issue: "Cross-Site Scripting (XSS) via unsanitized user input"
message: "User-controlled input is rendered into HTML/JS without sanitization. An attacker can inject malicious scripts that execute in victims' browsers."
remediation: "Sanitize output with DOMPurify or he.encode. Use textContent instead of innerHTML when inserting user data into the DOM. Set Content-Security-Policy headers."
