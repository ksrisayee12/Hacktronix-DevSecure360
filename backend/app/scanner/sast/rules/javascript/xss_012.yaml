rule_id: js_xss_012
vuln_class: XSS
severity: High
issue: DOM XSS via location.href = (CWE-79)
cwe: CWE-79
sources:
- req.query
- req.body
- req.params
- req.headers
- req.cookies
- request.query
- request.body
- location.search
- location.hash
- document.URL
- document.referrer
- window.location
- process.env
- process.argv
sinks:
- location.href =
sanitizers:
- DOMPurify.sanitize
- escapeHtml
- textContent
- innerText
remediation: Never assign user-controlled data to location.href =. Use textContent
  or DOMPurify.sanitize().
