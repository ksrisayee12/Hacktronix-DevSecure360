rule_id: js_secret_001
language: javascript
vuln_class: Hardcoded Secret
severity: High
cwe: CWE-798
owasp: A07:2021
confidence: Confirmed
sources: []
sinks: []
sanitizers: []
secret_patterns:
  variable_names:
    - api_key
    - apikey
    - apiKey
    - secret_key
    - secretKey
    - secret
    - password
    - passwd
    - token
    - auth_token
    - authToken
    - access_token
    - accessToken
    - private_key
    - privateKey
    - client_secret
    - clientSecret
    - credentials
    - bearer
  min_value_length: 8
  exclude_values:
    - ""
    - "your_key_here"
    - "change_me"
    - "example"
    - "placeholder"
    - "xxx"
    - "todo"
    - "test"
    - "changeme"
    - "process.env"
issue: "Hardcoded secret or credential in source code"
message: "A secret, API key, or token is hardcoded in JavaScript source code. This is exposed in browser bundles and version control."
remediation: "Use environment variables (process.env.SECRET_KEY) and a .env file with dotenv. Never commit secrets. Use a secrets manager for production."
