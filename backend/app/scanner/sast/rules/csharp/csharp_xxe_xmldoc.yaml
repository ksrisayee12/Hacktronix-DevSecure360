rule_id: csharp_xxe_xmldoc
language: csharp
vuln_class: XXE
severity: High
cwe: CWE-611
owasp: A05:2021-Security Misconfiguration
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: XML External Entity (XXE) Injection
message: |-
  User-supplied XML is parsed by an XML parser that has not explicitly disabled external entity resolution (prior to .NET 4.5.2).
sources:
- Request.QueryString[
- Request.Form[
- Request.Cookies[
- Request.Headers[
- Request.Params[
- Request.Item[
- HttpContext.Request.Query[
- HttpContext.Request.Form[
- Environment.GetEnvironmentVariable(
- Environment.GetCommandLineArgs(
sinks:
- new XmlDocument(
- new XmlTextReader(
- XDocument.Load(
- XElement.Load(
- XmlReader.Create(
sanitizers:
- XmlReaderSettings DtdProcessing = DtdProcessing.Prohibit
remediation: |-
  Explicitly disable DTD processing in XmlReaderSettings when parsing untrusted XML.

  UNSAFE:
    var doc = new XmlDocument();
    doc.LoadXml(xml);

  SAFE:
    var settings = new XmlReaderSettings { DtdProcessing = DtdProcessing.Prohibit };
    using (var reader = XmlReader.Create(new StringReader(xml), settings)) {
        var doc = new XmlDocument();
        doc.Load(reader);
    }
