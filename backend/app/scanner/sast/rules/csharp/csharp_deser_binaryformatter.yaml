rule_id: csharp_deser_binaryformatter
language: csharp
vuln_class: Deserialization
severity: Critical
cwe: CWE-502
owasp: A08:2021-Software and Data Integrity Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Insecure Deserialization via BinaryFormatter
message: |-
  Untrusted data is deserialized using BinaryFormatter or related classes. Attackers can execute arbitrary code upon deserialization.
sources:
- Request.QueryString[
- Request.Form[
- Request.Cookies[
- Request.Headers[
- Request.Params[
- Request.Item[
- HttpContext.Request.Query[
- HttpContext.Request.Form[
- Environment.GetEnvironmentVariable(
- Environment.GetCommandLineArgs(
sinks:
- BinaryFormatter.Deserialize(
- new BinaryFormatter(
- LosFormatter.Deserialize(
- ObjectStateFormatter.Deserialize(
- NetDataContractSerializer.Deserialize(
sanitizers: []
remediation: |-
  Do not use BinaryFormatter for deserialization; it is obsolete and inherently insecure. Use JsonSerializer or JsonConvert.

  UNSAFE:
    var formatter = new BinaryFormatter();
    formatter.Deserialize(stream);

  SAFE:
    JsonSerializer.Deserialize<MyClass>(stream);
