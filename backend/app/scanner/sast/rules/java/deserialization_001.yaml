rule_id: java_deser_001
vuln_class: Deserialization
severity: Critical
issue: Insecure Deserialization via Java ObjectInputStream (CWE-502)
cwe: CWE-502
sources:
- request.getParameter
- request.getHeader
- request.getCookies
- request.getInputStream
- request.getReader
- request.getQueryString
- request.getPathInfo
- request.getRemoteUser
- httpRequest.getParameter
- getParameter
- getHeader
- getQueryString
sinks:
- ObjectInputStream(
sanitizers:
- ObjectInputFilter
- SerialKiller
- ValidatingObjectInputStream
