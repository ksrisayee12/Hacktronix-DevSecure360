rule_id: java_secret_001
language: java
vuln_class: Hardcoded Secret
severity: High
cwe: CWE-798
owasp: A07:2021
confidence: Confirmed
sources: []
sinks: []
sanitizers: []
secret_patterns:
  variable_names:
    - apiKey
    - api_key
    - secretKey
    - secret_key
    - password
    - passwd
    - token
    - authToken
    - accessToken
    - privateKey
    - clientSecret
    - credentials
    - databasePassword
    - dbPassword
  min_value_length: 8
  exclude_values:
    - ""
    - "your_key_here"
    - "change_me"
    - "example"
    - "placeholder"
    - "test"
    - "changeme"
issue: "Hardcoded secret or credential in Java source code"
message: "A secret, API key, or password is hardcoded in Java source code. This is exposed in compiled artifacts and version control."
remediation: "Use environment variables or a properties file loaded at runtime. Consider AWS Secrets Manager or HashiCorp Vault for production."
