rule_id: php_sqli_014
vuln_class: SQLi
severity: Critical
issue: SQL Injection via WordPress wpdb results (CWE-89)
cwe: CWE-89
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- $wpdb->get_results(
sanitizers:
- prepare(
- bindParam(
- bindValue(
- real_escape_string
remediation: Use prepared statements with WordPress wpdb results. Never concatenate
  user data into SQL.
