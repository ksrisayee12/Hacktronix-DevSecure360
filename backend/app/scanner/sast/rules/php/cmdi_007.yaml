rule_id: php_cmdi_007
vuln_class: CMDi
severity: Critical
issue: Command Injection via backtick operator (CWE-78)
cwe: CWE-78
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- '`'
sanitizers:
- escapeshellarg(
- escapeshellcmd(
remediation: Never use backtick operator with user input. Use escapeshellarg() if
  shell execution is necessary.
