rule_id: php_cmdi_011
vuln_class: CMDi
severity: Critical
issue: Command Injection via preg_replace /e modifier (CWE-78)
cwe: CWE-78
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- preg_replace(
sanitizers:
- escapeshellarg(
- escapeshellcmd(
remediation: Never use preg_replace /e modifier with user input. Use escapeshellarg()
  if shell execution is necessary.
