rule_id: php_sqli_012
vuln_class: SQLi
severity: Critical
issue: SQL Injection via WordPress db_query (CWE-89)
cwe: CWE-89
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
