rule_id: php_cmdi_006
vuln_class: CMDi
severity: Critical
issue: Command Injection via proc_open() (CWE-78)
cwe: CWE-78
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- proc_open(
sanitizers:
- escapeshellarg(
- escapeshellcmd(
remediation: Never use proc_open() with user input. Use escapeshellarg() if shell
  execution is necessary.
