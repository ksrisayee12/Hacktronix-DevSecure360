rule_id: php_cmdi_004
vuln_class: CMDi
severity: Critical
issue: Command Injection via shell_exec() (CWE-78)
cwe: CWE-78
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- shell_exec(
sanitizers:
