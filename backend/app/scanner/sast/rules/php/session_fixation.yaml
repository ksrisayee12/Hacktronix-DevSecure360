rule_id: php_session_fixation_001
vuln_class: Session Flaw
severity: Medium
issue: Session Fixation via session_id() (CWE-384)
cwe: CWE-384
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- session_id(
sanitizers:
- session_regenerate_id(true)
remediation: Call session_regenerate_id(true) after successful login.
