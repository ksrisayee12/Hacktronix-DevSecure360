rule_id: php_sqli_009
vuln_class: SQLi
severity: Critical
issue: SQL Injection via pg_send_query (CWE-89)
cwe: CWE-89
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- pg_send_query(
sanitizers:
- prepare(
- bindParam(
- bindValue(
- real_escape_string
remediation: Use prepared statements with pg_send_query. Never concatenate user data
  into SQL.
