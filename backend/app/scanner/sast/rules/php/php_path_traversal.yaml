rule_id: php_path_traversal
language: php
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Path Traversal via file operations
message: |-
  User input dictates the file path used in file operations or inclusion. Attackers can read sensitive files or execute remote code (LFI/RFI).
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- include(
- include_once(
- require(
- require_once(
- fopen(
- file_get_contents(
- readfile(
- file(
- unlink(
sanitizers:
- basename(
- realpath(
remediation: |-
  Validate file paths to ensure they reside in the expected directory. Use basename() to extract only the filename from user input.

  UNSAFE:
    include($_GET['page'] . '.php');

  SAFE:
    $page = basename($_GET['page']);
    include($page . '.php');
