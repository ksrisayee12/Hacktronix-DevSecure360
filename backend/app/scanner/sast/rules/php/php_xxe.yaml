# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/611.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/php/semmle/php/security/XXE.qll
# Semgrep Source:  https://semgrep.dev/r/php.lang.security.xxe.xxe
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
# Verification:    simplexml_load_string() and DOMDocument::loadXML() are the standard vulnerable PHP XML parsing functions.

rule_id: php_xxe
language: php
vuln_class: XXE
severity: High
cwe: CWE-611
owasp: A05:2021-Security Misconfiguration
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: XML External Entity (XXE) Injection via unsafe XML parser
message: |-
  The application parses XML input using an unsafe configuration. An attacker can include external entities in the XML document, leading to local file disclosure, SSRF, or denial of service.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- simplexml_load_string(
- simplexml_load_file(
- DOMDocument::loadXML(
- DOMDocument::load(
- xml_parse(
- XMLReader::open(
sanitizers:
- libxml_disable_entity_loader(true)
remediation: |-
  Disable external entity loading before parsing XML data. Note that PHP 8.0+ disables entity loading by default. See OWASP XML External Entity Prevention Cheat Sheet for complete guidance.

  UNSAFE:
    $doc = simplexml_load_string($_POST['xml']);

  SAFE:
    libxml_disable_entity_loader(true);
    $doc = simplexml_load_string($_POST['xml']);
