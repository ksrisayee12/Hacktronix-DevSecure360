# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/90.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/php/semmle/php/security/dataflow/LdapInjection.qll
# Semgrep Source:  https://semgrep.dev/r/php.lang.security.ldap-injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
# Verification:    ldap_search(), ldap_list(), and ldap_read() execute LDAP queries and require ldap_escape() for safety.

rule_id: php_ldap_injection
language: php
vuln_class: LDAP Injection
severity: High
cwe: CWE-90
owasp: A03:2021-Injection
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: LDAP Injection via unsanitized input in LDAP query
message: |-
  User input is passed directly to LDAP search or modification functions without escaping. An attacker can manipulate the LDAP query to bypass authentication or access unauthorized directory information.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- ldap_search(
- ldap_list(
- ldap_read(
- ldap_add(
- ldap_modify(
- ldap_delete(
sanitizers:
- ldap_escape(
remediation: |-
  Escape all user-supplied input before using it in LDAP queries using the ldap_escape() function. See OWASP LDAP Injection Prevention Cheat Sheet for complete guidance.

  UNSAFE:
    $sr = ldap_search($ds, $dn, "cn=".$_GET['username']);

  SAFE:
    $sr = ldap_search($ds, $dn, "cn=".ldap_escape($_GET['username'], "", LDAP_ESCAPE_FILTER));
