rule_id: php_xss_001
vuln_class: XSS
severity: High
issue: XSS via echo  (CWE-79)
cwe: CWE-79
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- 'echo '
sanitizers:
- htmlspecialchars(
- htmlentities(
- strip_tags(
- filter_var(
remediation: Always use htmlspecialchars() with ENT_QUOTES when outputting user data
  to HTML.
