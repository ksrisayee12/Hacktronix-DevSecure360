rule_id: php_wp_001
vuln_class: SQLi
severity: Critical
issue: 'WordPress: WordPress raw SQL (CWE-89 / CWE-79)'
cwe: CWE-89
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- $wpdb->query(
sanitizers:
- esc_html(
- esc_attr(
- sanitize_text_field(
- wpdb->prepare(
remediation: 'Use $wpdb->query( with proper sanitization: wpdb->prepare() for SQL,
  esc_html() for output.'
