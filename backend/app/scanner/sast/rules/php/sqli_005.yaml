rule_id: php_sqli_005
vuln_class: SQLi
severity: Critical
issue: SQL Injection via PDO::query (CWE-89)
cwe: CWE-89
sources:
- $_GET
- $_POST
- $_REQUEST
- $_COOKIE
- $_SERVER
- $_FILES
- getallheaders
- file_get_contents('php://input')
sinks:
- $pdo->query(
sanitizers:
- prepare(
- bindParam(
- bindValue(
- real_escape_string
remediation: Use prepared statements with PDO::query. Never concatenate user data
  into SQL.
