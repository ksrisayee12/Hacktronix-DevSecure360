remediation: "Escape LDAP special characters (*, (, ), \\, \0) using a library function before including user input in LDAP queries.\n\nUNSAFE:\n  conn.search('dc=example,dc=com', f'(uid={username})')\n\nSAFE:\n  import ldap3.utils.conv\n  safe_username = ldap3.utils.conv.escape_filter_chars(username)\n  conn.search('dc=example,dc=com', f'(uid={safe_username})')"
