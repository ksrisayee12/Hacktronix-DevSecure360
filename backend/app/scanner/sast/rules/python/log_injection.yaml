rule_id: python_log_injection_001
language: python
vuln_class: Log Injection
severity: Low
cwe: CWE-117
owasp: A09:2021
confidence: Confirmed
sources:
  - request.args.get
  - request.form.get
  - request.json
  - request.values.get
  - request.headers.get
sinks:
  - logging.info(
  - logging.warning(
  - logging.error(
  - logging.debug(
  - logging.critical(
  - logger.info(
  - logger.warning(
  - logger.error(
  - logger.debug(
  - logger.critical(
  - log.info(
  - log.error(
  - print(
sanitizers:
  - repr(
  - ascii(
  - sanitize_log(
issue: "Log Injection via unsanitized user input in log message"
message: "User-controlled data is written directly to application logs without sanitization. An attacker can inject fake log entries, hide their tracks, or inject special characters that corrupt log files or trigger log viewer vulnerabilities."
remediation: "Never concatenate user input into log messages. Use structured logging with parameterized messages: logger.info('User: %s', user_input). Strip newline characters: user_input.replace(newlines). Use repr() to safely represent untrusted strings in logs."
