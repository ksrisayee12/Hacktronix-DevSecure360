sanitizers: []
remediation: |-
  Always explicitly restrict allowed algorithms when decoding JWTs to prevent the 'none' algorithm attack. See OWASP JSON Web Token Cheat Sheet for complete guidance.

  UNSAFE:
    payload = jwt.decode(token, secret_key)
    payload = jwt.decode(token, options={"verify_signature": False})

  SAFE:
    payload = jwt.decode(token, secret_key, algorithms=["HS256"])
