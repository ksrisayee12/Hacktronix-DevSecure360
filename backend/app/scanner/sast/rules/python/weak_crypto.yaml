rule_id: python_weak_crypto_001
language: python
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-327
owasp: A02:2021
confidence: Confirmed
# Weak crypto is detected by the semantic pattern engine (not taint).
# The sinks here are used by the _detect_weak_crypto() method in engine.py.
sources: []
sinks:
  - hashlib.md5(
  - hashlib.sha1(
  - MD5.new(
  - SHA.new(
  - Crypto.Hash.MD5
  - Crypto.Hash.SHA
  - des.DES(
  - DES.new(
  - ARC4.new(
  - RC4(
  - hashlib.new("md5"
  - hashlib.new("sha1"
  - hashlib.new('md5'
  - hashlib.new('sha1'
sanitizers: []
weak_crypto_patterns:
  always_weak:
    - "md5"
    - "sha1"
    - "des"
    - "rc4"
    - "arc4"
    - "blowfish"
  context_dependent:
    - "sha256"   # safe for hashing, NOT safe for passwords
    - "sha384"
    - "sha512"
  password_context_weak:
    - "sha256"
    - "sha512"
    - "sha384"
    - "sha1"
    - "md5"
  safe_alternatives:
    - "bcrypt"
    - "argon2"
    - "scrypt"
    - "pbkdf2"
    - "nacl"
    - "fernet"
issue: "Use of cryptographically weak algorithm"
message: "MD5 and SHA1 are cryptographically broken and should not be used for security-critical operations. MD5/SHA1 are vulnerable to collision attacks. For passwords, use bcrypt/argon2/scrypt."
remediation: "Replace MD5/SHA1 with SHA-256 or SHA-3 for general hashing. For password storage, use bcrypt (passlib.hash.bcrypt), argon2-cffi, or hashlib.scrypt. For encryption, use AES-GCM via cryptography.fernet."
