rule_id: python_deserialization_011
vuln_class: Deserialization
severity: Critical
issue: Insecure Deserialization via cattrs (CWE-502)
cwe: CWE-502
sources:
- request.form
- request.args
- request.data
- request.json
- request.get_json
- request.values
- request.files
- request.cookies
- request.headers
- request.GET
- request.POST
- request.body
- os.environ
- sys.argv
- input(
sinks:
- cattrs.structure
sanitizers:
- yaml.safe_load
- json.loads
remediation: Do not deserialize untrusted data with cattrs. Use json.loads() or yaml.safe_load()
  instead.
