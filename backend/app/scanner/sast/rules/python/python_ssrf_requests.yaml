remediation: |-
  Do not allow users to specify arbitrary URLs for the server to fetch. If dynamic URL fetching is required, validate the URL against a strict allowlist of permitted hostnames and protocols.

  UNSAFE:
    response = requests.get(request.args.get('url'))

  SAFE:
    url = request.args.get('url')
    if url in ['https://api.example.com', 'https://api2.example.com']:
        response = requests.get(url)
