rule_id: python_secret_001
language: python
vuln_class: Hardcoded Secret
severity: High
cwe: CWE-798
owasp: A07:2021
confidence: Confirmed
# This rule uses pattern matching, not taint analysis.
# Handled separately in the _detect_secrets() method of engine.py.
sources: []
sinks: []
sanitizers: []
secret_patterns:
  variable_names:
    - api_key
    - apikey
    - api_secret
    - secret_key
    - secret_token
    - password
    - passwd
    - pwd
    - access_token
    - private_key
    - client_secret
    - credentials
    - auth_token
    - bearer_token
  min_value_length: 8
  exclude_values:
    - "your_key_here"
    - "change_me"
    - "changeme"
    - "placeholder"
    - "xxxxxxxx"
    - "todo"
    - "insert_your"
    - "fill_in_here"
    - "replace_me"
    - "<api_key>"
    - "<secret>"
    - "your-secret"
    - "example_key"
    - "test_key"
issue: "Hardcoded secret or credential in source code"
message: "A secret, API key, password, or token is hardcoded in the source code. This will be exposed if the code is shared, committed to version control, or decompiled."
remediation: "Store secrets in environment variables and load them with os.environ.get('SECRET_KEY'). Use a secrets manager (AWS Secrets Manager, HashiCorp Vault) for production deployments."
