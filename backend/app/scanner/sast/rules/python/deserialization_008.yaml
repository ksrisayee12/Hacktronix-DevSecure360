rule_id: python_deserialization_008
vuln_class: Deserialization
severity: Critical
issue: Insecure Deserialization via jsonpickle (CWE-502)
cwe: CWE-502
sources:
- request.form
- request.args
- request.data
- request.json
- request.get_json
- request.values
- request.files
- request.cookies
- request.headers
- request.GET
- request.POST
- request.body
- os.environ
- sys.argv
- input(
sinks:
- jsonpickle.decode
sanitizers:
- yaml.safe_load
- json.loads
remediation: Do not deserialize untrusted data with jsonpickle. Use json.loads() or
  yaml.safe_load() instead.
