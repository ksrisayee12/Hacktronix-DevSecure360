issue: "Code Injection via eval() with user input"
message: "User-controlled input is passed to eval() or exec(). This allows attackers to execute arbitrary Python code on the server, leading to full system compromise."
remediation: "Never pass user input to eval() or exec(). If mathematical evaluation is needed, use ast.literal_eval() for safe literals, or a sandboxed math library like asteval."
