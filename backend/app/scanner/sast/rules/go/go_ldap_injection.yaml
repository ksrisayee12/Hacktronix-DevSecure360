# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/90.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/go/semmle/go/security/LdapInjection.qll
# Semgrep Source:  https://semgrep.dev/r/go.lang.security.ldap-injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
# Verification:    l.Search() and conn.Search() from github.com/go-ldap/ldap execute LDAP queries and require ldap.EscapeFilter() for safety.

rule_id: go_ldap_injection
language: go
vuln_class: LDAP Injection
severity: High
cwe: CWE-90
owasp: A03:2021-Injection
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: LDAP Injection via unsanitized input in go-ldap Search
message: |-
  User input is passed directly to LDAP search functions without escaping. An attacker can manipulate the LDAP query to bypass authentication or access unauthorized directory information.
sources:
- http.Request
- r.URL.Query().Get(
- r.FormValue(
- r.PostFormValue(
- r.Header.Get(
- r.Cookie(
- r.Body
- os.Getenv(
- os.Args[
sinks:
- l.Search(
- conn.Search(
sanitizers:
- ldap.EscapeFilter(
remediation: |-
  Escape all user-supplied input before using it in LDAP queries using the ldap.EscapeFilter() function. See OWASP LDAP Injection Prevention Cheat Sheet for complete guidance.

  UNSAFE:
    searchRequest := ldap.NewSearchRequest(..., fmt.Sprintf("(cn=%s)", userInput), ...)

  SAFE:
    searchRequest := ldap.NewSearchRequest(..., fmt.Sprintf("(cn=%s)", ldap.EscapeFilter(userInput)), ...)
