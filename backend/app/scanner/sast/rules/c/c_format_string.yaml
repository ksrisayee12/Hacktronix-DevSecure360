rule_id: c_format_string
language: c
vuln_class: Format String
severity: High
cwe: CWE-134
owasp: A03:2021-Injection
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Format String Vulnerability via printf family
message: |-
  User input is passed directly as the format string argument to a printf-family function. Attackers can inject format specifiers (like %x or %n) to read from or write to arbitrary memory locations.
sources:
- gets(
- fgets(
- scanf(
- fscanf(
- sscanf(
- read(
- recv(
- recvfrom(
- getenv(
- argv[
sinks:
- printf(
- fprintf(
- sprintf(
- snprintf(
- syslog(
- err(
- warn(
sanitizers: []
remediation: |-
  Never pass user input as the format string. Always use a static format string and pass the user input as an argument.

  UNSAFE:
    printf(argv[1]);

  SAFE:
    printf("%s", argv[1]);
